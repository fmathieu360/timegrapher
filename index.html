    <!-- Service Worker Script Registration for Offline Support -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'tg-v1';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>

    <!-- Main Logic Script -->
    <script>
        // DOM Elements
        const canvas = document.getElementById('timegrapherCanvas');
        const ctx = canvas.getContext('2d');
        const rateVal = document.getElementById('rateVal');
        const beatVal = document.getElementById('beatVal');
        const signalVal = document.getElementById('signalVal');
        const startBtn = document.getElementById('startBtn');
        const simBtn = document.getElementById('simBtn');
        const bphSelect = document.getElementById('bphSelect');

        // Application State Engine vars
        let isRunning = false;
        let isSimulating = false;
        let audioCtx = null;
        let processor = null;
        let wakeLock = null;
        let dataPoints = [];
        
        // Timing Configurations Variables
        let targetBph = parseInt(bphSelect.value);
        let expectedIntervalMs = 3600000 / targetBph;
        
        let lastEventTime = 0;
        let tickTockHistory = [];
        let simulationTimer = null;

        // Resize Canvas dynamically to match layout changes
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            renderTrace();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        bphSelect.addEventListener('change', () => {
            targetBph = parseInt(bphSelect.value);
            expectedIntervalMs = 3600000 / targetBph;
            clearMetrics();
        });

        function clearMetrics() {
            dataPoints = [];
            tickTockHistory = [];
            rateVal.innerText = "-- s/d";
            beatVal.innerText = "-- ms";
            renderTrace();
        }

        // --- CORE MATH ENGINE & ANALYSIS ---
        function registerTickEvent(timestampMs) {
            if (lastEventTime === 0) {
                lastEventTime = timestampMs;
                return;
            }

            const actualDelta = timestampMs - lastEventTime;
            lastEventTime = timestampMs;

            // Filters double triggers and micro-echo glitche errors
            if (actualDelta < expectedIntervalMs * 0.6) return;

            // Calculate instantaneous trace shift
            const baseRemainder = actualDelta % expectedIntervalMs;
            let drift = baseRemainder > expectedIntervalMs / 2 ? baseRemainder - expectedIntervalMs : baseRemainder;

            // Track alternate beat errors (Tick vs Tock sequence calculations)
            tickTockHistory.push(actualDelta);
            if (tickTockHistory.length > 20) tickTockHistory.shift();

            let computedBeatError = 0;
            if (tickTockHistory.length >= 2) {
                const len = tickTockHistory.length;
                computedBeatError = Math.abs(tickTockHistory[len-1] - tickTockHistory[len-2]) / 2;
            }

            // Rolling window calculation for Daily Rate
            if (tickTockHistory.length >= 8) {
                const averageDelta = tickTockHistory.reduce((a,b) => a+b, 0) / tickTockHistory.length;
                const errorRatio = (averageDelta - expectedIntervalMs) / expectedIntervalMs;
                const dailyRateSec = Math.round(errorRatio * 86400);
                
                rateVal.innerText = (dailyRateSec >= 0 ? "+" : "") + dailyRateSec + " s/d";
                rateVal.className = Math.abs(dailyRateSec) < 10 ? "text-xl font-bold text-emerald-400" : "text-xl font-bold text-amber-400";
                beatVal.innerText = computedBeatError.toFixed(1) + " ms";
            }

            // Save trace profile coordinates
            const isTick = tickTockHistory.length % 2 === 0;
            dataPoints.push({
                drift: drift,
                isTick: isTick,
                addedAt: Date.now()
            });

            // Restrict graph storage buffer cap limits
            if (dataPoints.length > 800) dataPoints.shift();
            renderTrace();
        }

        // --- SCROLLING CANVAS WATERFALL RENDERER ---
        function renderTrace() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            // Draw center baseline target alignment marker grid
            ctx.strokeStyle = 'rgba(31, 41, 55, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
            ctx.stroke();
